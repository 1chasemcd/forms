<table mat-table [dataSource]="dataSource()">
  @if (view().gridSelectionOptions; as selectionOptions) {
    <ng-container [matColumnDef]="SELECTION">
      <th mat-header-cell *matHeaderCellDef>
        @if (selectionOptions.selectionType === GridSelectionType.Multiple) {
          <mat-checkbox aria-label="Select All"></mat-checkbox>
        }
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row.get(view().idProperty).value) : null"
          [checked]="selection.isSelected(row)"
          aria-label="Select Row"
        ></mat-checkbox>
      </td>
    </ng-container>
  }
  @for (column of view().controls; track column.propertyName) {
    <ng-container [matColumnDef]="column.propertyName">
      <th mat-header-cell *matHeaderCellDef>{{ getLabel(column) }}</th>
      <td mat-cell *matCellDef="let row">{{ row.get(column.propertyName).value }}</td>
    </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="columns()"></tr>
  <tr mat-row *matRowDef="let rowData; columns: columns()"></tr>
</table>
