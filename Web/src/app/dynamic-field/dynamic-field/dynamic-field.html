@if (visible()) {
  @if (buttonField(); as button) {
    <app-dynamic-button-field [field]="button"></app-dynamic-button-field>
  } @else if (inputField(); as input) {
    <app-dynamic-input-field [field]="input"></app-dynamic-input-field>
  } @else if (staticTextField(); as statictext) {
    <app-dynamic-text-field [field]="statictext"></app-dynamic-text-field>
  }
}
