@if (visible()) {
  @switch (field().Type) {
    @case (FieldType.Button) {
      <app-button
        [field]="field()"
        [modelFormGroup]="modelFormGroup()"
        [label]="label()"
        (recalculateEvent)="executeRecalculate()"
      ></app-button>
    }
    @case (FieldType.CheckBox) {
      <app-checkbox
        [control]="control()"
        [label]="label()"
        (recalculateEvent)="executeRecalculate()"
      ></app-checkbox>
    }
    @case (FieldType.LabelValue) {
      <app-label-value [label]="label()" [control]="control()"></app-label-value>
    }
    @default {
      <app-standard-input-wrapper [label]="label()">
        <app-dynamic-input
          [control]="control()"
          [fieldType]="field().Type"
          (recalculateEvent)="executeRecalculate()"
        ></app-dynamic-input>
      </app-standard-input-wrapper>
    }
  }
}
