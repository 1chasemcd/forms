@if (visible()) {
  @switch (field().Type) {
    @case (FieldType.Button) {
      <app-dynamic-button-field
        [field]="field()"
        [modelFormGroup]="modelFormGroup()"
        [label]="label()"
      ></app-dynamic-button-field>
    }
    @default {
      <app-dynamic-input-field
        [field]="field()"
        [modelFormGroup]="modelFormGroup()"
        [label]="label()"
      ></app-dynamic-input-field>
    }
  }
}
