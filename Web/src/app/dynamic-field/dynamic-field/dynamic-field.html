@if (!field().Hidden) {
  @if (buttonField(); as button) {
    <app-dynamic-button-field [button]="button" [model]="model()"></app-dynamic-button-field>
  } @else if (inputField(); as input) {
    <app-dynamic-input-field [baseInput]="input" [model]="model()"></app-dynamic-input-field>
  } @else if (staticTextField(); as statictext) {
    <app-static-text-field [text]="label()"></app-static-text-field>
  }
}
