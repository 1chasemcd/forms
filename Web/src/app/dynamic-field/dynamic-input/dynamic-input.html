<app-standard-input-wrapper (focusin)="onFocus()" (focusout)="onBlur()" [label]="label()">
  @switch (fieldType()) {
    @case (FieldType.Currency) {
      <input [formControl]="control()" appStandardInputDirective appNumberFormat />
    }
    @case (FieldType.Numeric) {
      <input [formControl]="control()" appStandardInputDirective appNumberFormat />
    }
    @case (FieldType.Date) {
      <input [formControl]="control()" type="date" appStandardInputDirective />
    }
    @case (FieldType.Text) {
      <input [formControl]="control()" appStandardInputDirective />
    }
    @case (FieldType.TextArea) {
      <textarea [formControl]="control()" rows="3" appStandardInputDirective></textarea>
    }
    @case (FieldType.Time) {
      <input [formControl]="control()" type="time" appStandardInputDirective />
    }
  }
</app-standard-input-wrapper>
