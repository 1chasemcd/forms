@if (formContext && formDefinition) {
  <form
    (ngSubmit)="onSubmit()"
    [formGroup]="formContext.formGroup"
    class="p-4 min-[72rem]:max-w-6xl 2xl:max-w-3/4 w-full m-auto"
  >
    <app-dynamic-view
      [formView]="formDefinition.view"
      [formContext]="formContext"
    ></app-dynamic-view>
  </form>
}
