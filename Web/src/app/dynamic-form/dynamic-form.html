@if (formGroup && formDefinition) {
  <form
    (ngSubmit)="onSubmit()"
    [formGroup]="formGroup"
    class="p-4 min-[72rem]:max-w-6xl 2xl:max-w-3/4 w-full m-auto"
  >
    <app-dynamic-view
      [formView]="formDefinition.view"
      [modelFormGroup]="formGroup"
      [formDefinition]="formDefinition"
    ></app-dynamic-view>
  </form>
}
