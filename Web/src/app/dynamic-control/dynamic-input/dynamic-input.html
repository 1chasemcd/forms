<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
@switch (fieldType()) {
  @case (ControlType.Currency) {
    <input #input [formControl]="control()" appStandardInputDirective appNumberFormat />
  }
  @case (ControlType.Numeric) {
    <input #input [formControl]="control()" appStandardInputDirective appNumberFormat />
  }
  @case (ControlType.Date) {
    <input #input [formControl]="control()" type="date" appStandardInputDirective />
  }
  @case (ControlType.Text) {
    <input #input [formControl]="control()" appStandardInputDirective />
  }
  @case (ControlType.TextArea) {
    <textarea #input [formControl]="control()" rows="3" appStandardInputDirective></textarea>
  }
  @case (ControlType.Time) {
    <input #input [formControl]="control()" type="time" appStandardInputDirective />
  }
  @case (ControlType.CheckBox) {
    <label
      #input
      class="w-full h-full flex items-center justify-center"
      (mousedown)="$event.preventDefault()"
    >
      <app-checkbox-input [control]="control()"></app-checkbox-input>
    </label>
  }
}
