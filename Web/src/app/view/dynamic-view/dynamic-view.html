@if (title(); as title) {
  <h2 class="text-lg font-bold col-span-12 content-center">{{ title }}</h2>
}
@if (combinedViews(); as views) {
  @for (childView of views; track $index) {
    <app-dynamic-view [formView]="childView"></app-dynamic-view>
  }
} @else if (dataView(); as view) {
  @for (field of view.Fields; track $index) {
    <app-dynamic-field [field]="field"></app-dynamic-field>
  }
} @else if (subpropertyGridView(); as view) {
  <app-subproperty-grid-view [gridView]="view"></app-subproperty-grid-view>
}
