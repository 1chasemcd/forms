<div
  class="group bg-white px-3 py-1 rounded-lg ring-1 ring-gray-400 transition-colors focus-within:ring-violet-600 has-disabled:bg-gray-100"
>
  <label
    [attr.for]="id"
    class="block text-xs text-gray-500 transition-colors group-focus-within:text-violet-600"
  >
    {{ label() + requiredMark() }}
  </label>

  <textarea
    [id]="id"
    [formControl]="formControl()"
    rows="2"
    type="text"
    autocomplete="off"
    class="peer resize-y w-full bg-transparent text-base text-black outline-none disabled:text-gray-500"
  ></textarea>
</div>
