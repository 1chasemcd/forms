@if (currentForm(); as current) {
  <app-dynamic-form
    [formModel]="current.model"
    [viewId]="current.view"
    [modelPath]="current.$type === 'subproperty' ? current.path : ''"
  >
  </app-dynamic-form>
} @else if (error()) {
  An error occurred
} @else if (notFound()) {
  Form not found
} @else {
  <div class="flex-1 flex justify-center items-center">
    <app-spinner></app-spinner>
  </div>
}
