@if (this.formStack.activeEntry(); as active) {
  <app-dynamic-form
    [viewId]="active.view"
    [path]="active.$type === 'subproperty' ? active.path : ''"
  >
  </app-dynamic-form>
} @else if (error()) {
  An error occurred
} @else if (notFound()) {
  Form not found
} @else {
  <div class="flex-1 flex justify-center items-center">
    <app-spinner></app-spinner>
  </div>
}
