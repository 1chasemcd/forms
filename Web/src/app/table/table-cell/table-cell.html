<div
  [attr.tabindex]="isEnabled() && !draft() ? 0 : null"
  (focusin)="startEdit($event)"
  [class]="
    'flex items-center border rounded border-transparent px-2 w-full h-10' +
    ' [scrollbar-none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden' +
    (isEnabled()
      ? ' focus-within:hover:border-violet-600 focus-within:border-violet-600 hover:border-gray-400'
      : '')
  "
>
  @if (draft(); as draft) {
    <app-dynamic-input
      (focusout)="stopEdit()"
      [control]="draft"
      [fieldType]="fieldType()"
      class="flex-1"
    ></app-dynamic-input>
  } @else if (control(); as control) {
    <app-table-cell-content
      (mousedown)="maybeHandleCheckbox()"
      [value]="control.value"
      [fieldType]="fieldType()"
      class="flex-1"
    ></app-table-cell-content>
  }
</div>
